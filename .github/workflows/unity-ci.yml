name: Unity tests

on:
  push:
    branches: [main, dev, ci, refactor-structure]
  # This is a bit of a radioactive event; we need to be very careful with what permissions
  # we assign this action, as we're allowing arbitrary code execution with the context of
  # whatever permissions we assign.
  pull_request_target: {}
  workflow_dispatch: {}
  workflow_call:
    secrets:
      UNITY_USER:
        required: true
      UNITY_PASS:
        required: true

# pull_request_target grants access to a privileged GITHUB_TOKEN by default, revoke this
permissions: {}

env:
  LIBRARY_CACHE_PREFIX: 'Library-v5'

jobs:
  changed-files:
    name: Check whether Unity tests are needed
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-unity: ${{ steps.changes.outputs.run-unity || 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'push' || github.event_name == 'pull_request_target'
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          # Inspect filenames only; never execute code from the PR.
          allow-unsafe-pr-checkout: 'true'

      - id: changes
        name: Classify changed files
        if: github.event_name == 'push' || github.event_name == 'pull_request_target'
        shell: python {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_PR: ${{ github.event_name == 'pull_request_target' }}
        run: |
          import os
          import subprocess
          from pathlib import PurePosixPath

          def excluded(path):
              parts = PurePosixPath(path).parts
              return (
                  (len(parts) == 3 and parts[:2] == ("Editor", "Localization") and path.endswith(".json"))
                  or (len(parts) == 1 and path.endswith(".md"))
                  or any(part.endswith("~") for part in parts[:-1])
              )

          # PRs compare against the merge base; pushes compare the complete before/after trees.
          # Disable rename detection so moving a file out of a tested directory still runs Unity.
          run_unity = True
          base = os.environ["BASE_SHA"]
          head = os.environ["HEAD_SHA"]
          if base and base != "0" * 40:
              try:
                  subprocess.run(["git", "fetch", "--no-tags", "origin", base], check=True)
                  revisions = [f"{base}...{head}"] if os.environ["IS_PR"] == "true" else [base, head]
                  result = subprocess.check_output(
                      ["git", "diff", "--no-renames", "--name-only", "-z", *revisions, "--"]
                  )
                  paths = result.decode("utf-8", errors="surrogateescape").split("\0")[:-1]
                  run_unity = not all(excluded(path) for path in paths)
              except subprocess.CalledProcessError:
                  print("Unable to determine changed files; running Unity tests.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"run-unity={str(run_unity).lower()}\n")
          print("Running Unity tests." if run_unity else "Only excluded files changed; skipping Unity tests.")

  build-and-test:
    name: Unit tests
    needs: changed-files
    strategy:
      fail-fast: false
      matrix:
        unity_major_version: [ "2022", "6000.0", "6000.5" ]
        sdk: [ vrcsdk, standalone ]
        testmode: [ All ]
        exclude:
          - unity_major_version: "6000.0"
            sdk: vrcsdk
          - unity_major_version: "6000.5"
            sdk: vrcsdk
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
    steps:
      # Matrix entries must report success even when excluded changes skip Unity work.
      - name: Skip Unity tests for excluded changes
        if: needs.changed-files.outputs.run-unity != 'true'
        run: echo "Only excluded files changed; Unity tests were skipped successfully."

      - id: configure
        name: Configure
        env:
          unity_major_version: ${{ matrix.unity_major_version }}
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          if [ $unity_major_version = 2022 ]; then
            echo "unity_version=2022.3.6f1" >> $GITHUB_OUTPUT
          elif [ $unity_major_version = 6000.0 ]; then
            echo "unity_version=6000.0.60f1" >> $GITHUB_OUTPUT
          elif [ $unity_major_version = 6000.5 ]; then
            echo "unity_version=6000.5.9f1" >> $GITHUB_OUTPUT
          else
            echo "Invalid unity_major_version: $unity_major_version"
            exit 1
          fi 
      - id: setup
        name: Setup
        env:
          unity_version: ${{ steps.configure.outputs.unity_version }}
          sdk: ${{ matrix.sdk }}
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          set -x
          
          sudo apt-get update && sudo apt-get -y install libxml2-utils xmlstarlet # xmllint

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changed-files.outputs.run-unity == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # We are forced to use pull_request_target to get access to a unity license to run the unit tests.
          # To limit the risk here, we explicitly opt out of all permissions (except for read-contents and write-checks)
          # and expose only the unity license secret.
          allow-unsafe-pr-checkout: 'true'

      - id: prepare-project
        name: Prepare project
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          mkdir .github/ProjectRoot/Packages/nadena.dev.modular-avatar -p
          mv * .github/ProjectRoot/Packages/nadena.dev.modular-avatar
          mv .github/ProjectRoot/* .
          mv 'Packages/nadena.dev.modular-avatar/UnitTests~' 'Packages/nadena.dev.modular-avatar/UnitTests'
          ls -l
          for i in packages-lock manifest vpm-manifest; do
            if [ -e "$i-${{ matrix.unity_major_version }}-${{ matrix.sdk }}.json" ]; then
              mv "$i-${{ matrix.unity_major_version }}-${{ matrix.sdk }}.json" Packages/$i.json -v
            elif [ -e "$i-${{ matrix.unity_major_version }}.json" ]; then
              mv "$i-${{ matrix.unity_major_version }}.json" Packages/$i.json -v
            fi
          done

      - uses: anatawa12/sh-actions/setup-vrc-get@1d155c7a26bcd0a54ffd9cb38fd66ab0d32d23cd
        if: needs.changed-files.outputs.run-unity == 'true'

      - name: Resolve packages
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          vrc-get repo add -- "https://vpm.nadena.dev/vpm-prerelease.json" || true
          vrc-get repo add -- "https://vrchat.github.io/packages/index.json?download" || true
          vrc-get resolve --project .
          vrc-get info project --project .

      - name: "Debug: List project contents"
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          ls -lR
          ls -lR Packages/nadena*
          
      - id: prepare-standalone
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (matrix.sdk == 'standalone') }}
        name: Prepare standalone environment
        run: |
          cd Packages/nadena.dev.ndmf
          ln -s 'Dependencies~' Dependencies
          cd ../nadena.dev.modular-avatar
          if ! [ -e UnitTests/GenericTests ]; then
            rm -rf UnitTests # tests are not supported in standalone yet
          fi

      - name: "Debug: List package versions"
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          for i in Packages/*/package.json; do
            echo $i
            cat $i | jq .version
          done

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changed-files.outputs.run-unity == 'true'
        with:
          path: Library
          key: ${{ env.LIBRARY_CACHE_PREFIX }}-${{ steps.configure.outputs.unity_version }}-${{ matrix.sdk }}
          restore-keys: |
            ${{ env.LIBRARY_CACHE_PREFIX }}-${{ steps.configure.outputs.unity_version }}-${{ matrix.sdk }}
            ${{ env.LIBRARY_CACHE_PREFIX }}-${{ steps.configure.outputs.unity_version }}

      - uses: buildalon/unity-setup@30fcbcb56c10ea5d64298e970d952b8d29bc268b # v2.6.0
        id: unity-setup
        if: needs.changed-files.outputs.run-unity == 'true'
        with:
          unity-version: ${{ steps.configure.outputs.unity_version }}
          build-targets: StandaloneWindows64
          cache-installation: true
          hub-version: '3.19.5'
          
      - uses: buildalon/activate-unity-license@e0d245d0787b7b9931b56ccbde3b508f6b70f1af # v2.2.2
        if: needs.changed-files.outputs.run-unity == 'true'
        with:
          license: 'Personal' # Choose license type to use [ Personal, Professional, Floating ]
          username: ${{ secrets.UNITY_USER }}
          password: ${{ secrets.UNITY_PASS }}

      # Import the project separately. Unity 2022.3.6f1 can fail when the initial import and
      # test run happen in the same editor process.
      - uses: buildalon/unity-action@a9d19e1bc9e9881dae7e2fb33895384c22858e4c # v4.0.2
        name: Build project
        if: needs.changed-files.outputs.run-unity == 'true'
        continue-on-error: true
        with:
          build-target: StandaloneWindows64
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: .
          args: >
            -buildTarget StandaloneWindows64
            -batchmode
            -quit
            -force-graphics
            -logFile "test-results~/build.log"
            -enableCodeCoverage
            -debugCodeOptimization
            -overrideTextureCompression ForceUncompressed
      
      - uses: buildalon/unity-action@a9d19e1bc9e9881dae7e2fb33895384c22858e4c # v4.0.2
        name: EditMode UnitTests
        if: needs.changed-files.outputs.run-unity == 'true'
        with:
          build-target: StandaloneWindows64
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: .
          args: >
            -buildTarget StandaloneWindows64
            -batchmode
            -force-graphics
            -logFile "test-results~/editmode.log"
            -runTests
            -testPlatform editmode
            -enableCodeCoverage
            -debugCodeOptimization
            -testResults "test-results~/editmode-results.xml"
            -coverageResultsPath "test-results~/coverage"
            -coverageOptions "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+nadena.dev.*"
            -assemblyNames "Tests;nadena.dev.modular-avatar.tests;nadena.dev.modular-avatar.tests.vrchat;nadena.dev.modular-avatar.tests.playmode"
            -overrideTextureCompression ForceUncompressed

      - uses: buildalon/unity-action@a9d19e1bc9e9881dae7e2fb33895384c22858e4c # v4.0.2
        name: PlayMode UnitTests
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (always()) }}
        with:
          build-target: StandaloneWindows64
          editor-path: ${{ steps.unity-setup.outputs.unity-editor-path }}
          project-path: .
          args: >
            -buildTarget StandaloneWindows64
            -batchmode
            -force-graphics
            -logFile "test-results~/playmode.log"
            -runTests
            -testPlatform playmode
            -enableCodeCoverage
            -debugCodeOptimization
            -testResults "test-results~/playmode-results.xml"
            -coverageResultsPath "test-results~/coverage"
            -coverageOptions "generateAdditionalMetrics;generateHtmlReport;generateBadgeReport;assemblyFilters:+nadena.dev.*"
            -assemblyNames "Tests;nadena.dev.modular-avatar.tests;nadena.dev.modular-avatar.tests.vrchat;nadena.dev.modular-avatar.tests.playmode"
            -overrideTextureCompression ForceUncompressed
            
      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (matrix.testmode != 'EditMode') }}
        with:
          reporter: dotnet-nunit
          name: PlayMode Tests
          fail-on-empty: ${{ matrix.sdk == 'vrcsdk' }}
          path: "test-results~/playmode-results.xml"

      - uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (matrix.testmode != 'PlayMode') }}
        with:
          reporter: dotnet-nunit
          name: EditMode Tests
          fail-on-empty: ${{ matrix.sdk == 'vrcsdk' }}
          path: "test-results~/editmode-results.xml"
          
      - name: Check for test completion
        if: needs.changed-files.outputs.run-unity == 'true'
        run: |
          if ! [ -e "test-results~"/editmode-results.xml ]; then
            echo "Edit mode test results not found"
            exit 1
          fi
          if ! [ -e "test-results~"/playmode-results.xml ]; then
            echo "Play mode test results not found"
            exit 1
          fi
      
      - name: List compile errors
        continue-on-error: true
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (failure()) }}
        run: |
          for log in "test-results~/editmode.log" "test-results~/playmode.log"; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            perl -ne '$out = 0 if /^#####|^-----EndCompilerOutput/; $out = 1 if /^##### Output|^-----CompilerOutput/; print if $out;' "$log"
          done

      - name: List compiler warnings
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (true) }}
        run: |
          for log in "test-results~/editmode.log" "test-results~/playmode.log"; do
            [ -f "$log" ] || continue
            echo "===== $log ====="
            grep ': warning CS' "$log" || true
          done
          
      - name: List test failures (edit mode)
        continue-on-error: true
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (failure()) }}
        run: |
          if [ -f "test-results~/editmode-results.xml" ]; then
            xmllint --pretty 2 --nocompact --xpath '//test-case[@result!="Passed"]' \
              "test-results~/editmode-results.xml" || true
          fi
          
      - name: List test failures (play mode)
        continue-on-error: true
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (failure()) }}
        run: |
          if [ -f "test-results~/playmode-results.xml" ]; then
            xmllint --pretty 2 --nocompact --xpath '//test-case[@result!="Passed"]' \
              "test-results~/playmode-results.xml" || true
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (always()) }}
        with:
          name: Coverage results ${{ steps.configure.outputs.unity_version }} ${{ matrix.sdk }}
          path: "test-results~/coverage"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        continue-on-error: true
        if: ${{ needs.changed-files.outputs.run-unity == 'true' && (always()) }}
        with:
          name: Test results ${{ steps.configure.outputs.unity_version }} ${{ matrix.sdk }}
          path: "test-results~"
